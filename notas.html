<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMBRANTIUM – Notas</title>
<link rel="stylesheet" href="style.css">
<script>
(function() {
  const savedTheme = localStorage.getItem('umbrantium-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
})();
</script>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="logo">UMBRANTIUM</div>
<nav>
  <a href="personagens.html">Personagens</a>
  <a href="index.html">Ficha Atual</a>
  <a href="inventario.html">Inventário</a>
  <a href="habilidades.html">Habilidades</a>
  <a href="notas.html">Notas</a>
</nav>
  
<div class="sidebar-export">
  <button id="export-btn" class="sidebar-btn">📥 Exportar</button>
  <button id="import-btn" class="sidebar-btn">📤 Importar</button>
  <button id="clear-btn" class="sidebar-btn sidebar-btn-danger">🗑️ Limpar Tudo</button>
  <input type="file" id="import-file" accept=".json" style="display:none">
</div>

<div class="sidebar-theme">
  <label for="theme-selector">🎨 Tema</label>
  <select id="theme-selector" class="theme-select">
    <option value="dark">Escuro (Padrão)</option>
    <option value="light">Claro</option>
    <option value="blue">Azul Oceano</option>
    <option value="forest">Verde Floresta</option>
    <option value="purple">Roxo Místico</option>
    <option value="crimson">Vermelho Carmesim</option>
  </select>
</div>
  
  <div class="brand-small">Umbrantium</div>
  <button class="toggle" id="menuToggle">☰</button>
</aside>

  <main class="content">
    <header class="top-header">
      <h1>NOTAS</h1>
      <p class="subtitle">Anotações e Diário de Aventuras</p>
    </header>

    <section class="sheet">
      <div class="notes-container">
        
        <!-- Área de Notas Rápidas -->
        <div class="panel notes-quick">
          <h2>Notas Rápidas</h2>
          <textarea id="quick-notes" placeholder="Escreva suas notas rápidas aqui..."></textarea>
        </div>

        <!-- Lista de Notas Detalhadas -->
        <div class="panel notes-detailed">
          <h2>Diário de Aventuras</h2>
          <button class="add-btn" id="add-note">+ Nova Entrada</button>
          <div id="notes-list"></div>
        </div>

      </div>
    </section>

    <footer class="footer">Umbrantium – Fichas salvas localmente no seu navegador</footer>
  </main>
</div>

<!-- Bibliotecas para QR Code e Compressão -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="script.js"></script>
</body>
</html>
